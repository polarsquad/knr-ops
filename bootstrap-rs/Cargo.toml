[package]
name = "knr-bootstrap"
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
description = "One-time imperative bootstrap for the knr-ops management cluster (Rust port of bootstrap.sh)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util"] }
tempfile = "3"
