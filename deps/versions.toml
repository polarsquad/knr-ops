# deps/versions.toml - the authoritative dependency version catalog.
# A dependency bump changes exactly one value here. See docs/dependencies.md.
# Consumers are either generated from this file (zarf.yaml, images.txt,
# airgap scripts via catalog.env) or validated against it (manifests, CI).

[versions]
# mise tools
go = "1.26"
kubectl = "1.35"
kind = "0.32"
helm = "4.2"
clusterctl = "1.14.0"          # tracks capi
zarf = "0.83.0"                # CLI pin; zarf.yaml images use v-prefixed refs
renovate = "44.50.1"           # CLI used by the digest-pinning integration test
clusterawsadm = "2.13.0"       # tracks capa
mise = "2026.8.10"

# kubernetes nodes and clusters (intentionally different, see docs)
k8s_mgmt_node = "1.36.1"       # kind mgmt node image tag (kindest/node)
k8s_workload_node = "1.35.0"   # CAPD workload nodes (local-host profile)
k8s_eks = "1.34.6"             # EKS workload clusters (aws profile)

# cluster-api family
capi = "1.14.0"
capa = "2.13.0"
caaph = "0.6.4"
capi_operator_chart = "0.28.0"

# flux family
flux_operator_chart = "0.58.0"
flux_distribution = "2.x"
flux_source_controller = "1.9.4"
flux_kustomize_controller = "1.9.4"
flux_helm_controller = "1.6.3"
flux_notification_controller = "1.9.3"

# platform components
cert_manager = "1.21.1"
konflate = "0.5.0"
podinfo = "6.14.0"
registry = "2"
kindnetd = "v20260528-9350166c"
pause = "3.10.1"
haproxy = "v20230606-42a2262b"

# ack controllers
ack_iam = "1.7.2"
ack_eks = "1.16.0"
ack_s3 = "1.7.1"
ack_rds = "1.10.0"

# eks addons
eks_addon_vpc_cni = "1.21.1-eksbuild.7"
eks_addon_coredns = "1.13.2-eksbuild.4"
eks_addon_kube_proxy = "1.34.6-eksbuild.2"   # tracks k8s_eks today; bump manually
eks_addon_pod_identity_agent = "1.3.10-eksbuild.3"

# github actions
gh_checkout_airgap = "7.0.1"
gh_checkout_validate = "5"
gh_checkout_renovate_test = "7.0.1"
gh_setup_node = "7.0.0"
gh_cache = "4"
gh_mise_action = "4.2.3"
gh_upload_artifact = "7.0.1"
gh_download_artifact = "8.0.0"
gh_yamllint_action = "v3"

# unpinned by current decision; recorded so the decision is visible
flux2 = "latest"
sops = "latest"
age = "latest"
aws_cli = "latest"

[images]
# composed references; the env emitter and renderer expand these
mgmt_node = "kindest/node:v{k8s_mgmt_node}"
workload_node = "kindest/node:v{k8s_workload_node}"

[[slot]]
key = "go"
file = "mise.toml"
pattern = 'go = "{version}"'
count = 1

[[slot]]
key = "kubectl"
file = "mise.toml"
pattern = 'kubectl = "{version}"'
count = 1

[[slot]]
key = "kind"
file = "mise.toml"
pattern = 'kind = "{version}"'
count = 1

[[slot]]
key = "helm"
file = "mise.toml"
pattern = 'helm = "{version}"'
count = 1

[[slot]]
key = "clusterctl"
file = "mise.toml"
pattern = 'clusterctl = "{version}"'
count = 1

[[slot]]
key = "zarf"
file = "mise.toml"
pattern = 'version = "v{version}"'
count = 1

[[slot]]
key = "renovate"
file = ".github/workflows/validate.yml"
pattern = 'renovate@{version}'
count = 1

[[slot]]
key = "clusterawsadm"
file = "mise.aws.toml"
pattern = 'version = "{version}"'
count = 1

[[slot]]
key = "mise"
file = "mise.toml"
pattern = 'min_version = "{version}"'
count = 1

# pivot.sh installs these imperatively in the management cluster before Flux
# exists; the literals must track the catalog like the HelmReleases do.
[[slot]]
key = "cert_manager"
file = "pivot.sh"
pattern = 'CERT_MANAGER_VERSION="{version}"'
count = 1

[[slot]]
key = "capi_operator_chart"
file = "pivot.sh"
pattern = 'CAPI_OPERATOR_VERSION="{version}"'
count = 1

# The Rust binary installs the flux charts imperatively before Flux exists;
# the constant must track the catalog like the HelmChartProxies do.
[[slot]]
key = "flux_operator_chart"
file = "bootstrap-rs/src/main.rs"
pattern = 'FLUX_CHART_VERSION: &str = "{version}"'
count = 1
