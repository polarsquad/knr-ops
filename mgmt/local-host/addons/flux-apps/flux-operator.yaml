apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: flux-operator
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      fluxcd: enabled
      profile: local-host
  repoURL: oci://ghcr.io/controlplaneio-fluxcd/charts
  chartName: flux-operator
  version: "0.58.0"
  namespace: flux-system
  options:
    waitForJobs: true
    wait: true
    timeout: 5m
    install:
      createNamespace: true
