apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-apps
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 10m
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./mgmt/local-host/addons/flux-apps
  dependsOn:
    - name: caaph-system
    - name: local-workload-cni
