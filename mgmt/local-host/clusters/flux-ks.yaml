apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: docker-workload-cluster
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: ./mgmt/local-host/clusters/docker
  dependsOn:
    - name: capd-system
  healthChecks:
    - apiVersion: cluster.x-k8s.io/v1beta2
      kind: Cluster
      name: local-workload
      namespace: default
