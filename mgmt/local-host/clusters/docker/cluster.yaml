apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: local-workload
  namespace: default
  labels:
    profile: local-host
spec:
  clusterNetwork:
    pods:
      cidrBlocks:
        - 192.168.0.0/16
    serviceDomain: cluster.local
    services:
      cidrBlocks:
        - 10.128.0.0/12
  topology:
    classRef:
      name: docker-workload
    version: v1.35.0
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
        - class: default-worker
          name: md-0
          replicas: 1
