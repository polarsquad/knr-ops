# Registers one Flux Kustomization per provider directory, all depending on
# capi-operator (infrastructure/) and capi-system (the CAPI core). Health
# checks gate on each provider's CRDs so dependents only apply once the
# provider APIs exist. Mirrors mgmt/local-host/capi-providers/flux-ks.yaml.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capi-system
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/local-talos/capi-providers/capi-system
  dependsOn:
    - name: capi-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cabpt-system
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/local-talos/capi-providers/cabpt-system
  dependsOn:
    - name: capi-system
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: talosconfigs.bootstrap.cluster.x-k8s.io
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cacppt-system
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/local-talos/capi-providers/cacppt-system
  dependsOn:
    - name: capi-system
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: taloscontrolplanes.controlplane.cluster.x-k8s.io
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: capt-system
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m
  prune: true
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./mgmt/local-talos/capi-providers/capt-system
  dependsOn:
    - name: capi-system
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: tinkerbellclusters.infrastructure.cluster.x-k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: tinkerbellmachines.infrastructure.cluster.x-k8s.io
